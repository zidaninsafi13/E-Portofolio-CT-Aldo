<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portofolio Aldona Abdullah Ibrahim: enam topik Computational Thinking, karya individu dan kelompok, serta refleksi pembelajaran PJOK." />
    <meta name="author" content="Aldona Abdullah Ibrahim" />
    <script>
      (() => {
        let theme;
        try { theme = localStorage.getItem('portfolio-theme'); } catch {}
        document.documentElement.dataset.theme = theme === 'dark' || theme === 'light'
          ? theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" type="image/jpeg" href="%BASE_URL%favicon/favicon.jpeg" />
    <title>E-Portfolio Computational Thinking</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
